{% set name = "libpysal" %}
{% set version = "4.15.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: db9eee1579678a2eec6974c831dc93abf612a4df5a3c45e9d7ed35ea5f9e2497
  patches:
    - patches/0001-test_weights_relative_to_absolute.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<312]
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools_scm >=6.2
    - toml
    - wheel
  run:
    - python
    - beautifulsoup4 >=4.13.0
    - geopandas >=1.1.0
    - jinja2
    - numpy >=2.0.0
    - packaging >=24.1
    - pandas >=2.3.0
    - platformdirs >=4.3
    - requests >=2.32.0
    - scikit-learn >=1.5.0
    - scipy >=1.14.0
    - shapely >=2.1
  run_constrained:
    - joblib >=1.5.0
    - networkx >=3.4
    - numba >=0.60
    - pandarm >=0.0
    - pulp <4
    - pyarrow >=16.1
    - sqlalchemy >=2.0
    - xarray >=2024.5
    - zstd

test:
  source_files:
    - libpysal/weights/tests/test_weights.py
    - pyproject.toml
  imports:
    - libpysal
    - libpysal.cg
    - libpysal.cg.ops
    - libpysal.examples
    - libpysal.io
    - libpysal.io.geotable
    - libpysal.io.iohandlers
    - libpysal.io.tests
    - libpysal.io.util
    - libpysal.weights
    - libpysal.common
  commands:
    - pip check
      # check that pip gets the correct version 
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - python -c "from libpysal.examples import summary; print(summary())"
    - python -c "from libpysal.examples import available; print(available())"
    - python -c "from libpysal.examples import get_path; example_path = get_path('10740.shp'); assert(example_path is not None)"
      # smoke test on only test weight due to the rest of the test using all relative imports to the source code.
      # skipping test_plot due to reading a datafile, importing matplotlib and warnings causing overall test to fail.
    - pytest -vv libpysal/weights/tests/test_weights.py -k "not test_plot"
  requires:
    - pip
    - pytest

about:
  home: https://pysal.org
  summary: Core components of PySAL A library of spatial analysis functions
  description: |
    libpysal offers four modules that form the building blocks in many upstream 
    packages in the PySAL family. Spatial Weights: libpysal.weights. Input-and 
    output: libpysal.io. Computational geometry: libpysal.cg. Built-in example 
    datasets libpysal.examples
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  dev_url: https://github.com/pysal/libpysal
  doc_url: https://pysal.org/libpysal

extra:
  recipe-maintainers:
    - ocefpaf
  skip-lints:
    - missing_pip_check  # anaconda-linter internal crash on this recipe (reproduces on master); `pip check` IS present in test.commands
    - missing_test_requirement_pip  # anaconda-linter internal crash on this recipe (reproduces on master); `pip` IS present in test.requires
